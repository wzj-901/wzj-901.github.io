function u8(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function dec(k, b){
  var p = b.split('.');
  var salt = u8(p[0]), iv = u8(p[1]), ct = u8(p[2]);
  return crypto.subtle.importKey('raw', new TextEncoder().encode(k), 'PBKDF2', false, ['deriveKey'])
    .then(function(kk){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:20000, hash:'SHA-256'}, kk, {name:'AES-GCM', length:256}, false, ['decrypt']); })
    .then(function(dk){ return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, dk, ct); })
    .then(function(pt){ return new TextDecoder().decode(pt); });
}
function enter(){
  var k = prompt('请输入密钥');
  if(k === null){ document.getElementById('lb').textContent = '已取消'; return; }
  localStorage.setItem(KEY_LOCAL, k);
  unlock(k);
}
function unlock(k){
  dec(k, enc).then(function(h){ document.open(); document.write(h); document.close(); })
    .catch(function(){ alert('密钥错误'); localStorage.removeItem(KEY_LOCAL); enter(); });
}
var saved = localStorage.getItem(KEY_LOCAL);
if(saved){ unlock(saved); } else { enter(); }
